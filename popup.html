<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Chat Scroll</title>
  <style>
    body {
      min-width: 350px; /* Wider for better text visibility */
      max-height: 500px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      background: #333;
      color: #fff;
      margin: 0;
      padding: 12px 16px;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    ul {
      list-style: none;
      padding: 10px;
      margin: 0;
    }
    li {
      margin-bottom: 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    li:hover {
      background: #f0f0f0;
    }
    span {
      font-size: 13px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
      margin-right: 10px;
      flex-grow: 1;
    }
    span:hover {
      color: #0066cc;
    }
    .del-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      line-height: 1;
      border-radius: 4px;
    }
    .del-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <h3>Jump to Element</h3>
  <ul id="bookmark-list"></ul>
  <script src="storage/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
