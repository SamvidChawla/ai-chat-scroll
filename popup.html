<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Chat Scroll</title>
  <style>
    body {
      width: 300px;
      max-height: 400px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      background: #333;
      color: #fff;
      margin: 0;
      padding: 10px 15px;
      font-size: 14px;
      position: sticky;
      top: 0;
    }
    ul {
      list-style: none;
      padding: 10px;
      margin: 0;
    }
    li {
      margin-bottom: 8px;
      padding: 8px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: box-shadow 0.2s;
    }
    li:hover {
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    span {
      font-size: 13px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      margin-right: 10px;
    }
    span:hover {
      color: #0066cc;
    }
    .del-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 16px; /* Slightly larger for the X */
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      line-height: 1;
    }
    .del-btn:hover {
      color: #ff4444;
      background: #ffeeee;
    }
  </style>
</head>
<body>
  <h3>Jump to Element</h3>
  <ul id="bookmark-list"></ul>

  <script src="storage/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
